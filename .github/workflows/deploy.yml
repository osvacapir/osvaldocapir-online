name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy portfolio (TUS)
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: osvaldocapir.online
          HOSTINGER_USERNAME: u578573205
        run: bash scripts/deploy-hostinger.sh

      - name: Verify live site
        run: |
          sleep 3
          curl -fsSL "https://osvaldocapir.online/" | grep -q "ULO"
          echo "Live site OK"
